name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Empaqueter l'app
        run: zip -r stockage-cloud-backend.zip . -x ".git/*" "node_modules/*" "uploads/*" "*.db"
      - uses: actions/upload-artifact@v4
        with:
          name: stockage-cloud-backend
          path: stockage-cloud-backend.zip
